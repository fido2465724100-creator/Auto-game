services:
  db:
    image: postgres:16-alpine
    container_name: auto-tycoon-db
    environment:
      POSTGRES_DB: auto_tycoon
      POSTGRES_USER: auto_tycoon
      POSTGRES_PASSWORD: auto_tycoon
    ports:
      - '55432:5432'
    volumes:
      - auto_tycoon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auto_tycoon -d auto_tycoon']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    container_name: auto-tycoon-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://auto_tycoon:auto_tycoon@db:5432/auto_tycoon
    ports:
      - '4100:4000'

  web:
    build:
      context: .
      target: web
    container_name: auto-tycoon-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4100
    ports:
      - '3100:3000'

volumes:
  auto_tycoon_db_data:
